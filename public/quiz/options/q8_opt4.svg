      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="24" fill="url(#grad-japan)" stroke="#29324c" stroke-width="3" />
  <circle cx="60" cy="60" r="46" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" opacity="0.4" />
  
  <!-- Rising Red Sun -->
  <circle cx="60" cy="42" r="20" fill="#ef4444" stroke="#29324c" stroke-width="2.5" />

