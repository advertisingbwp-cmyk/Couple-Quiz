<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="grad-dubai" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="24" fill="url(#grad-dubai)" stroke="#29324c" stroke-width="3" />
  <circle cx="60" cy="60" r="46" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" opacity="0.4" />
  
  <!-- Left Building -->
  <rect x="22" y="60" width="16" height="32" rx="2" fill="#7dd3fc" stroke="#29324c" stroke-width="2.5" />
  
  <!-- Burj Khalifa Tower Silhouette -->
  <!-- Spire -->
  <line x1="56" y1="14" x2="56" y2="30" stroke="#29324c" stroke-width="3" stroke-linecap="round" />
  <!-- Spire tip ball -->
  <circle cx="56" cy="14" r="2" fill="#38bdf8" />
  
  <!-- Tier 1 -->
  <rect x="52" y="30" width="8" height="14" fill="#38bdf8" stroke="#29324c" stroke-width="2.5" />
  <!-- Tier 2 -->
  <rect x="48" y="44" width="16" height="14" fill="#0284c7" stroke="#29324c" stroke-width="2.5" />
  <!-- Tier 3 -->
  <rect x="44" y="58" width="24" height="14" fill="#0369a1" stroke="#29324c" stroke-width="2.5" />
  <!-- Base Tier -->
  <rect x="40" y="72" width="32" height="20" rx="2" fill="#075985" stroke="#29324c" stroke-width="2.5" />

  <!-- Ground Line -->
  <line x1="16" y1="92" x2="104" y2="92" stroke="#29324c" stroke-width="3" stroke-linecap="round" />

  <!-- Shopping Bag Foreground (Dubai Shopping) -->
  <path d="M80 68 C80 61 92 61 92 68" fill="none" stroke="#29324c" stroke-width="2.5" stroke-linecap="round" />
  <rect x="74" y="68" width="24" height="24" rx="4" fill="#fbbf24" stroke="#29324c" stroke-width="2.5" />
  <!-- Star on Bag -->
  <polygon points="86,75 87.5,78.5 91,79 88.5,81.5 89,85 86,83 83,85 83.5,81.5 81,79 84.5,78.5" fill="#ffffff" />
</svg>